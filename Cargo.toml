[package]
name = "cosmic-bing-wallpaper"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "COSMIC panel applet that applies Bing's image of the day as wallpaper"

[dependencies]
# Feature flags copied from pop-os/cosmic-applets workspace (verified 2026-08-07).
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "8a017a15ee7753241c0a631b4294a68edf79b13b", default-features = false, features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "desktop-systemd-scope",
    "winit",
] }
cosmic-bg-config = { git = "https://github.com/pop-os/cosmic-bg", rev = "1685f7fc99cbb9cbe981ac672d6451ba6faff7db" }
# 0.25 matches the version pinned by the cosmic-bg workspace (image = "0.25.10").
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Not used directly: zune-jpeg 0.5.x (image's jpeg decoder) fails to compile on
# rustc 1.97 without its `log` feature (its no-op `warn!` expands to nothing in
# expression position, src/mcu_prog.rs:463). Features are additive, so enabling
# `log` here fixes the copy `image` uses.
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "log"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
dirs = "6"
# Only what the applet itself touches: `time::sleep` for the one-shot
# timers, plus `rt` + `macros` for the `#[tokio::test]` harness. Everything
# else tokio-ish (reqwest I/O, libcosmic's executor) enables its own
# features additively.
tokio = { version = "1", features = ["macros", "rt", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

# Note: cosmic-bg-config depends on cosmic-config from the libcosmic repo
# *unpinned* (default branch). It cannot be unified with our rev-pinned
# libcosmic source via [patch] (cargo rejects the patch while upstream HEAD ==
# the pinned rev: "points to the same source"). The committed Cargo.lock pins
# that transitive source's exact sha instead.

[profile.release]
opt-level = 3
lto = "thin"
