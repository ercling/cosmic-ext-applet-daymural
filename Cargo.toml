[package]
name = "daymural"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Daymural: daily Microsoft Bing wallpaper applet for the COSMIC desktop"
repository = "https://github.com/ercling/cosmic-ext-applet-daymural"
homepage = "https://github.com/ercling/cosmic-ext-applet-daymural"

[dependencies]
# Feature flags copied from pop-os/cosmic-applets workspace (verified 2026-08-07).
# Deliberately no `rev`: cosmic-bg-config's transitive cosmic-config names this
# repo bare, and a second `?rev=` source id breaks offline Flatpak vendoring.
# The exact commit remains pinned by the committed Cargo.lock.
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "desktop-systemd-scope",
    "winit",
] }
cosmic-bg-config = { git = "https://github.com/pop-os/cosmic-bg", rev = "1685f7fc99cbb9cbe981ac672d6451ba6faff7db" }
# 0.25 matches the version pinned by the cosmic-bg workspace (image = "0.25.10").
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Not used directly: zune-jpeg 0.5.x (image's jpeg decoder) fails to compile on
# rustc 1.97 without its `log` feature (its no-op `warn!` expands to nothing in
# expression position, src/mcu_prog.rs:463). Features are additive, so enabling
# `log` here fixes the copy `image` uses.
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "log"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
dirs = "6"
# Fluent i18n. Versions/features mirror libcosmic's own (Cargo.toml:130) so
# the whole dependency graph resolves to a single copy of each crate.
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
# `debug-embed`: without it a debug build reads `i18n/` from the compile-time
# `CARGO_MANIFEST_DIR` at runtime, so a moved checkout panics on the loader's
# `expect` — and the README's "no runtime data files" claim would hold for
# release builds only.
rust-embed = { version = "8", features = ["debug-embed"] }
# Only what the applet itself touches: `time::sleep` for the one-shot
# timers, plus `rt` + `macros` for the `#[tokio::test]` harness. Everything
# else tokio-ish (reqwest I/O, libcosmic's executor) enables its own
# features additively.
tokio = { version = "1", features = ["macros", "rt", "time"] }
# Same 0.12.x cosmic-config serializes keys with (one copy in the graph):
# `accent::write_theme` diffs the *serialized* forms to decide whether a key
# write would change its bytes — several theme fields round-trip lossily in
# value space, so a value compare cannot answer that question.
ron = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# System-bus lock/resume watch (`src/lockwatch.rs`). Feature shape matches how
# libcosmic enables zbus (its `tokio` feature sets `zbus?/tokio`); default
# features would drag the whole `async-io` executor stack in. Cargo.lock
# already resolves zbus 5.18.0 through libcosmic — this edge changes nothing
# else there.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
# `test-util` unlocks `#[tokio::test(start_paused = true)]`: the lock-poke
# ladder test drains real `tokio::time::sleep` rungs, and paused time
# auto-advances them instead of sleeping 1 s + 4 s per run. Dev-only —
# additive features never reach the shipped binary's tokio.
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }

# Note: cosmic-bg-config depends on cosmic-config from the bare libcosmic repo.
# Our libcosmic declaration deliberately uses the same source id so Cargo and
# the Flatpak vendoring generator see one repo spelling. The committed
# Cargo.lock pins that shared source to its exact sha.

[profile.release]
opt-level = 3
lto = "thin"
