name: Rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libcosmic resolves these native libraries through pkg-config. D-Bus
      # also supplies dbus-run-session for an isolated test session bus.
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus libwayland-dev libxkbcommon-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: dbus-run-session -- cargo test
