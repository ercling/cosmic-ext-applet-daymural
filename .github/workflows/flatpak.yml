name: Flatpak

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      # Keep this tag aligned with the manifest's Freedesktop runtime version;
      # the digest pins the exact privileged build environment.
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:6f3180c6765cb55e5dcd8ee4127b82aba25163c8c655a161422b7c447c14e4af
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"

      - name: Test Git manifest traversal
        run: python3 packaging/flatpak/test_git_manifest_scan.py

      - name: Generate cargo-sources.json
        run: packaging/flatpak/generate-cargo-sources.sh

      - name: Check Cargo.lock source coverage
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from urllib.parse import urlsplit, urlunsplit

          def canonical_git(url):
              parsed = urlsplit(url)
              scheme = "https" if parsed.netloc == "github.com" else parsed.scheme
              path = parsed.path.rstrip("/")
              if parsed.netloc == "github.com":
                  path = path.lower()
              if path.endswith(".git"):
                  path = path[:-4]
              return urlunsplit((scheme, parsed.netloc, path, "", ""))

          with open("Cargo.lock", "rb") as handle:
              packages = tomllib.load(handle)["package"]
          with open("packaging/flatpak/cargo-sources.json", encoding="utf-8") as handle:
              generated = json.load(handle)

          archives = {entry.get("url") for entry in generated if entry.get("type") == "archive"}
          git_sources = {
              (entry.get("url"), entry.get("commit"))
              for entry in generated
              if entry.get("type") == "git"
          }
          missing = []
          for package in packages:
              source = package.get("source", "")
              if source.startswith("registry+"):
                  name = package["name"]
                  version = package["version"]
                  expected = f"https://static.crates.io/crates/{name}/{name}-{version}.crate"
                  if expected not in archives:
                      missing.append(f"{name} {version} ({source})")
              elif source.startswith("git+"):
                  repository, commit = source.removeprefix("git+").rsplit("#", 1)
                  repository = canonical_git(repository)
                  if (repository, commit) not in git_sources:
                      missing.append(source)

          if missing:
              raise SystemExit("packaging/flatpak/cargo-sources.json misses Cargo.lock entries:\n" + "\n".join(missing))
          print(f"covered {sum('source' in package for package in packages)} Cargo.lock packages")
          PY

      - name: Validate AppStream metadata
        run: appstreamcli validate --pedantic --explain --strict --no-net --override cid-contains-uppercase-letter=error data/io.github.ercling.cosmic-ext-applet-daymural.metainfo.xml

      - name: Build and bundle the Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6
        with:
          manifest-path: packaging/flatpak/io.github.ercling.cosmic-ext-applet-daymural.json
          bundle: daymural.flatpak
